name: Python Framework

# Manual milestone: validate pinned upstream CPython, compile our bridge for
# device + simulator, and execute a bounded native simulator embedding probe.
# PEP 684 is part of CPython 3.12; no invented configure switch is required.
on:
  workflow_dispatch:

concurrency:
  group: python-framework-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: CPython 3.12 + native bridge (iOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            python
            tools/runtime
            tools/ci
            swift/PluginHost

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test runtime packaging
        run: python -m unittest discover -s tools/runtime/tests -v

      - name: Test Swift runtime bootstrap
        run: swift test --package-path swift/PluginHost --jobs 2 --filter 'PythonRuntimeConfigurationTests|BridgeAccountArgumentTests|PluginEventQueueTests|SubinterpreterLifecycleTests'

      - name: Compile and run Swift adapter with native CPython
        run: python tools/runtime/check_swift_embedding.py --output "$RUNNER_TEMP/python-swift"

      - name: Cache pinned support archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/python-support-cache
          key: python-ios-support-${{ hashFiles('python/runtime/support-lock.json') }}

      - name: Fetch and verify CPython support
        run: |
          set -euo pipefail
          python tools/runtime/support.py fetch \
            --cache "$RUNNER_TEMP/python-support-cache" \
            --extract "$RUNNER_TEMP/python-support" \
            --report "$RUNNER_TEMP/python-support-manifest.json"

      - name: Compile and run native runtime probes
        run: |
          set -euo pipefail
          python tools/runtime/validate_runtime.py \
            --support "$RUNNER_TEMP/python-support" \
            --output "$RUNNER_TEMP/python-native" \
            --simulator-device 'iPhone 17'

      - name: Package framework and smoke artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-artifacts"
          cp "$RUNNER_TEMP"/python-support-cache/*.tar.gz "$RUNNER_TEMP/runtime-artifacts/"
          cp "$RUNNER_TEMP/python-support-manifest.json" "$RUNNER_TEMP/runtime-artifacts/"
          cp "$RUNNER_TEMP/python-native/runtime-manifest.json" "$RUNNER_TEMP/runtime-artifacts/"
          cp "$RUNNER_TEMP/python-native/simulator-smoke.json" "$RUNNER_TEMP/runtime-artifacts/"
          cp "$RUNNER_TEMP/python-native/simulator-engine-smoke.json" "$RUNNER_TEMP/runtime-artifacts/"
          cp "$RUNNER_TEMP/python-swift/swift-engine-smoke.json" "$RUNNER_TEMP/runtime-artifacts/"
          cp "$RUNNER_TEMP/python-native/ExteralessPythonSmoke-unsigned.ipa" "$RUNNER_TEMP/runtime-artifacts/"
          tar -czf "$RUNNER_TEMP/runtime-artifacts/ExteralessPythonBridge.xcframework.tar.gz" \
            -C "$RUNNER_TEMP/python-native" ExteralessPythonBridge.xcframework
          echo 'CPython and the native bridge ran on the simulator. Device code compiled; device installation remains unverified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated runtime
        uses: actions/upload-artifact@v4
        with:
          name: Python-3.12-ios-runtime-${{ github.run_number }}
          path: ${{ runner.temp }}/runtime-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload probe diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-probe-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/python-support-manifest.json
            ${{ runner.temp }}/python-native/*.json
            ${{ runner.temp }}/python-native/*.log
            ${{ runner.temp }}/python-native/*.ips
            ${{ runner.temp }}/python-native/*.crash
            ${{ runner.temp }}/python-swift/*.json
            ${{ runner.temp }}/python-swift/*.log
          if-no-files-found: ignore
          retention-days: 7
