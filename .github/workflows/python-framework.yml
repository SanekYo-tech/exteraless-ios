name: Python Framework
run-name: Unsigned archive clone closure c73f

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-proof:
    name: Owned archive clone proof (180s)
    runs-on: macos-26
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXTERALESS_REQUIRE_DARWIN_CLONE: '1'
      EXTERALESS_ARCHIVE_COPY_REPORT: ${{ runner.temp }}/bundle-clone-evidence/darwin-clone.json
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            telegram-ios/build-system/Make
            telegram-ios/build-system/patches
            telegram-ios/build-system/bazel-rules/rules_apple
            tools/ci/tests

      - name: Checkout and verify exact rules_apple gitlink
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle-clone-evidence"
          git submodule update --init --depth=1 -- telegram-ios/build-system/bazel-rules/rules_apple
          rules=telegram-ios/build-system/bazel-rules/rules_apple
          expected=485016eb5b0948cc17307064e7977a6d68e94046
          test "$(git rev-parse HEAD:$rules)" = "$expected"
          test "$(git -C "$rules" rev-parse HEAD)" = "$expected"
          {
            git rev-parse HEAD
            git ls-tree HEAD "$rules"
            git -C "$rules" rev-parse HEAD
            git diff-tree --no-commit-id --name-only -r HEAD
            python3 --version
            sw_vers
          } | tee "$RUNNER_TEMP/bundle-clone-evidence/git-pins.txt"

      - name: Execute actual rule shell and Darwin clone proof
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os, pathlib, platform, subprocess, sys, time
          assert sys.platform == 'darwin', platform.platform()
          assert sys.version_info >= (3, 10), sys.version
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bundle-clone-evidence' / 'unittest.log'
          started = time.monotonic()
          command = [sys.executable, '-B', '-m', 'unittest', '-v',
                     'tools.ci.tests.test_unsigned_archive_copy', 'tools.ci.tests.test_unsigned_build']
          try:
              with output.open('w') as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, timeout=175)
          finally:
              print(output.read_text(), flush=True)
              print('elapsedSeconds:', round(time.monotonic() - started, 3), flush=True)
          raise SystemExit(result.returncode)
          PY

      - name: Retain bounded clone receipts and exact pins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-archive-clone-${{ github.run_id }}
          path: ${{ runner.temp }}/bundle-clone-evidence/
          if-no-files-found: error
          retention-days: 7
