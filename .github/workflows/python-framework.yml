name: Native Developer Listener Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listener:
    name: Native Darwin developer listener only
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/python-framework.yml
            /telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/PluginUI/PluginUIModel.swift
            /telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/PluginUI/PluginUIStyleModel.swift
            /telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/PluginUI/PluginDeveloperProtocol.swift
            /telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/PluginUI/PluginDeveloperServer.swift
            /tools/compat/tests/fixtures/sdk_developer/NativeDeveloperServerProbe.swift
            /tools/compat/tests/test_sdk_developer_native.py
      - name: Preserve exact workflow and source inputs
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-listener/evidence'
          output.mkdir(parents=True, exist_ok=True)
          ui = 'telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/PluginUI/'
          names = ['.github/workflows/python-framework.yml', 'tools/compat/tests/test_sdk_developer_native.py',
                   'tools/compat/tests/fixtures/sdk_developer/NativeDeveloperServerProbe.swift']
          names += [ui + name for name in ('PluginUIModel.swift', 'PluginUIStyleModel.swift', 'PluginDeveloperProtocol.swift', 'PluginDeveloperServer.swift')]
          pins = {}
          for name in names:
              source = root / name
              target = output / 'sources' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              pins[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          (output / 'workflow-inputs.json').write_text(json.dumps({'source_sha256': pins, 'commit': os.environ['GITHUB_SHA'],
              'developer_dir': os.environ['DEVELOPER_DIR'], 'compile_timeout_seconds': 120, 'execution_timeout_seconds': 10}, indent=2) + '\n')
          PY
      - name: Compile 120s and execute 10s actual listener fixture
        timeout-minutes: 3
        run: python3 -B tools/compat/tests/test_sdk_developer_native.py "$RUNNER_TEMP/native-listener"
      - name: Always upload source pins and native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-developer-listener-${{ github.run_id }}
          path: ${{ runner.temp }}/native-listener/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
