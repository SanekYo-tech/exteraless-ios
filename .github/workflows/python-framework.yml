          def run(name,args,limit):
              start=time.monotonic(); p=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)
              timeout=False
              try: data,_=p.communicate(timeout=limit)
              except subprocess.TimeoutExpired:
                  timeout=True; os.killpg(p.pid,signal.SIGKILL); data,_=p.communicate()
              (out/(name+'.log')).write_bytes(data)
              sys.stdout.write(data.decode('utf-8','replace')); sys.stdout.flush()
