name: Python Framework
run-name: Independent five SDK children — 3daf8d97

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-five-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  five-native-children:
    name: Actual Swift/C/CPython five-child gate
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      EXPECTED_SOURCE: 3daf8d97bb35b02120cbeae95e94ee8c9362bdb9
      VERIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout exact published source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3daf8d97bb35b02120cbeae95e94ee8c9362bdb9
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            docs/parity
            docs/wave-2
            python
            tools/runtime
            tools/compat
            swift/PluginHost
            swift/ExteralessCore
            telegram-ios/submodules/TelegramCore/Sources/ExteralessRuntime
            telegram-ios/submodules/TelegramUI/Sources/Exteraless
            telegram-ios/submodules/TelegramUI/Sources/ExteralessClient

      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Seal raw source, OriginalSDK36 and compiler inputs
        id: source
        timeout-minutes: 2
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import hashlib, json, os, platform, shutil, subprocess, sys
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          evidence = Path(os.environ['RUNNER_TEMP']) / 'five-evidence'
          evidence.mkdir()
          def digest(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def query(command): return subprocess.check_output(command, cwd=root, text=True, timeout=30).strip()
          revision = query(['git', 'rev-parse', 'HEAD'])
          assert revision == os.environ['EXPECTED_SOURCE'], revision
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], cwd=root, check=True, timeout=30)
          prefixes = ['.github/workflows', 'docs/parity', 'docs/wave-2', 'python', 'tools/runtime', 'tools/compat',
                      'swift/PluginHost', 'swift/ExteralessCore',
                      'telegram-ios/submodules/TelegramCore/Sources/ExteralessRuntime',
                      'telegram-ios/submodules/TelegramUI/Sources/Exteraless',
                      'telegram-ios/submodules/TelegramUI/Sources/ExteralessClient']
          records = subprocess.check_output(['git', 'ls-files', '--stage', '-z', '--', *prefixes], cwd=root, timeout=30)
          entries = []
          for row in records.split(b'\0'):
              if not row: continue
              meta, name = row.split(b'\t', 1)
              mode, oid, stage = meta.decode().split()
              relative = name.decode('utf-8')
              if mode != '160000' and (root / relative).is_file(): entries.append((oid, relative))
          raw = subprocess.check_output(['git', 'cat-file', '--batch'], cwd=root,
                                       input=''.join(oid + '\n' for oid, _ in entries).encode(), timeout=60)
          cursor, pins = 0, {}
          for oid, relative in entries:
              end = raw.index(b'\n', cursor)
              header = raw[cursor:end].split()
              size = int(header[2]); cursor = end + 1
              blob = raw[cursor:cursor + size]; cursor += size + 1
              assert header[0].decode() == oid and (root / relative).read_bytes() == blob, relative
              destination = evidence / 'source-copies' / 'repository' / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(blob)
              pins[relative] = hashlib.sha256(blob).hexdigest()
          assert cursor == len(raw)
          modules = json.loads((root / 'docs/parity/sdk-surface.json').read_text())['modules']
          assert len(modules) == 36
          for module in modules.values():
              assert module['same_source'] is True and pins[module['file']] == module['sha256'] == module['android_sha256'], module['file']
          sys.path[:0] = [str(root), str(root / 'tools/runtime')]
          import check_swift_plugin_embedding as gate
          import verify_native_sdk_cohort as final_reader
          from tools.compat.sdk_config_manifest import root_registration
          root_pins = {}; registration = root_registration(root_pins)
          assert gate.TIMEOUT == 30 and len(final_reader.CHILDREN) == 5
          elyx_inputs = gate.elyx_developer.source_inputs(root / 'python')
          assert all(path.is_file() for path in elyx_inputs)
          assert all((root / name).is_file() for name in gate.SDK_TL_CODEC_SOURCES)
          assert (root / 'python/runtime/include/module.modulemap').is_file()
          assert (root / 'swift/PluginHost/Sources/CPluginHostShims/include/ph_atomic.h').is_file()
          metadata = {'source_revision': revision, 'workflow_revision': os.environ['VERIFICATION_WORKFLOW_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'repository': os.environ['GITHUB_REPOSITORY'], 'python': sys.version,
                      'platform': platform.platform(), 'developer_dir': os.environ['DEVELOPER_DIR'],
                      'xcode': query(['xcodebuild', '-version']), 'swift': query(['xcrun', 'swift', '--version']),
                      'macos_sdk': query(['xcrun', '--sdk', 'macosx', '--show-sdk-path']),
                      'workspace': str(root), 'runner_temp': os.environ['RUNNER_TEMP'],
                      'original_sdk_byte_identical': 36, 'native_children': 5, 'child_timeout_seconds': 30,
                      'root_registration': registration, 'root_source_sha256': root_pins,
                      'source_c_sha256': pins['python/bridge/_exteraless_bridge.c'],
                      'raw_git_files_verified': len(pins), 'pytest_required': False}
          (evidence / 'source-provenance.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (evidence / 'source-sha256.json').write_text(json.dumps(pins, sort_keys=True, indent=2) + '\n')
          print(json.dumps(metadata, indent=2))
          PY

      - name: Stage checksum-locked pure dependencies
        id: dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -B tools/runtime/vendor_dependencies.py \
            --cache "$RUNNER_TEMP/python-wheel-cache" \
            --output "$GITHUB_WORKSPACE/python/vendor" \
            --report "$RUNNER_TEMP/five-evidence/python-dependencies.json" \
            2>&1 | tee "$RUNNER_TEMP/five-evidence/dependency-driver.log"

      - name: Compile and execute actual Swift/C embedding prerequisite
        id: embedding
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python -B tools/runtime/check_swift_embedding.py \
            --python "$(command -v python)" --output "$RUNNER_TEMP/python-swift" \
            2>&1 | tee "$RUNNER_TEMP/five-evidence/swift-embedding-driver.log"

      - name: Compile actual Host and execute five fresh SDK children
        id: sdk
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python -B tools/runtime/check_swift_plugin_embedding.py \
            --python "$(command -v python)" \
            --python-root "$GITHUB_WORKSPACE/python" --output "$RUNNER_TEMP/python-plugin" \
            2>&1 | tee "$RUNNER_TEMP/five-evidence/five-child-driver.log"

      - name: Independently verify all five reports, markers, custody and source pins
        id: acceptance
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python -B tools/runtime/verify_native_sdk_cohort.py --directory "$RUNNER_TEMP/python-plugin" \
            2>&1 | tee "$RUNNER_TEMP/five-evidence/five-child-verifier.log"

      - name: Preserve complete execution evidence and first failure phase
        if: ${{ always() }}
        timeout-minutes: 2
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          EMBEDDING_OUTCOME: ${{ steps.embedding.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          temporary = Path(os.environ['RUNNER_TEMP']).resolve()
          output = temporary / 'python-plugin'
          output.mkdir(exist_ok=True)
          verification = output / 'verification'
          verification.mkdir(exist_ok=True)
          evidence = temporary / 'five-evidence'
          if evidence.is_dir(): shutil.copytree(evidence, verification, dirs_exist_ok=True)
          engine = temporary / 'python-swift'
          if engine.is_dir(): shutil.copytree(engine, verification / 'engine', dirs_exist_ok=True)
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          read_errors = []
          def read_json(path):
              try: return json.loads(path.read_text())
              except Exception as error:
                  read_errors.append({'file': path.name, 'error': type(error).__name__ + ': ' + str(error)[:1000]})
                  return {}
          stages = {name: os.environ[name.upper() + '_OUTCOME'] for name in ('source', 'dependency', 'embedding', 'sdk', 'acceptance')}
          native = output / 'swift-plugin-smoke.json'
          native_report = read_json(native) if native.is_file() else {}
          failed = next((name for name, outcome in stages.items() if outcome in ('failure', 'cancelled')), None)
          phase = native_report.get('phase')
          if failed == 'embedding': phase = 'embedding.runtime' if (engine / 'swift-engine-console.log').is_file() else 'embedding.compile'
          error_log = {'embedding': 'swift-embedding-driver.log', 'sdk': 'five-child-driver.log',
                       'dependency': 'dependency-driver.log', 'acceptance': 'five-child-verifier.log'}.get(failed)
          excerpt = []
          if error_log and (verification / error_log).is_file():
              lines = (verification / error_log).read_text(errors='replace').splitlines()
              excerpt = [line[:800] for line in lines if 'error:' in line.lower() or 'failed' in line.lower()][:8]
          summary = {'source_revision': os.environ['EXPECTED_SOURCE'], 'workflow_revision': os.environ['VERIFICATION_WORKFLOW_SHA'],
                     'run_id': os.environ['GITHUB_RUN_ID'], 'step_outcomes': stages,
                     'first_failed_step': failed, 'native_phase': phase,
                     'driver_error': native_report.get('driver_error', native_report.get('error')), 'cause_excerpt': excerpt,
                     'report_read_errors': read_errors,
                     'five_child_acceptance_present': (output / 'five-child-acceptance.json').is_file()}
          source_map, changed = [], []
          sealed = output / 'build-inputs.json'
          if sealed.is_file():
              inputs = read_json(sealed)
              for name, expected in inputs.get('source_sha256', {}).items():
                  source = Path(name)
                  if not source.is_file() or sha(source) != expected: changed.append(name); continue
                  if source.is_relative_to(root):
                      target = verification / 'source-copies' / 'repository' / source.relative_to(root)
                      if target.is_file() and sha(target) != expected: changed.append(name); continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if not target.exists(): shutil.copyfile(source, target)
                  elif source.is_relative_to(output): target = source
                  else: raise RuntimeError('Unexpected external source input: ' + name)
                  source_map.append({'source': name, 'artifact': target.relative_to(output).as_posix(), 'sha256': expected})
          summary['source_changes'] = changed
          summary['mapped_build_inputs'] = len(source_map)
          (verification / 'source-map.json').write_text(json.dumps(source_map, indent=2) + '\n')
          binary_paths = sorted((output / 'build').glob('*.o')) + [output / 'build/swift-plugin-probe']
          binaries = {path.relative_to(output).as_posix(): sha(path) for path in binary_paths if path.is_file()}
          (verification / 'fresh-binary-sha256.json').write_text(json.dumps(binaries, sort_keys=True, indent=2) + '\n')
          (verification / 'execution-status.json').write_text(json.dumps(summary, indent=2) + '\n')
          if failed or changed or read_errors:
              (verification / 'failure.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          assert not changed, 'Source changed after capture/compilation; evidence retained'
          assert not read_errors, 'A native report is malformed; evidence retained'
          PY

      - name: Upload full five-child directory on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-sdk-five-3daf8d97-${{ github.run_id }}
          path: ${{ runner.temp }}/python-plugin
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
