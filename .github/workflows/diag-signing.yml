name: Diag Signing

# Быстрая диагностика фейк-подписи (2–5 минут вместо 1.5ч сборки):
# генерация серта -> импорт в keychain -> извлечение SHA из профиля
# (как rules_apple) -> codesign дамми-бинарника в контексте Bazel-экшена.

on:
  workflow_dispatch:

concurrency:
  group: diag-signing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diag:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cert (as in ios-build)
        run: |
          set -uo pipefail
          cd telegram-ios/build-system/fake-codesigning/certs
          openssl req -x509 -newkey rsa:2048 -days 3650 -nodes \
            -keyout self.key -out self.cer \
            -subj "/CN=Telegram Fake Signing/O=Telegram/C=US" \
            -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export -out SelfSigned.p12 \
            -inkey self.key -in self.cer -passout pass:secret -legacy
          cp self.cer Public.cer
          rm -f self.key self.cer
          openssl x509 -in SelfSigned.p12 -passin pass:secret -noout -subject -fingerprint

      - name: Import via ImportCertificates
        run: |
          set -uo pipefail
          cd telegram-ios
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          echo "=== find-identity -v -p codesigning ==="
          security find-identity -v -p codesigning || echo "(find-identity: exit $?)"
          echo "=== list-keychains ==="
          security list-keychains
          echo "=== manual re-import (loud) ==="
          security import build-system/fake-codesigning/certs/SelfSigned.p12 \
            -k temp.keychain -P secret \
            -T /usr/bin/codesign -T /usr/bin/security
          echo "=== unlock ==="
          security unlock-keychain -p secret temp.keychain
          security find-identity -v -p codesigning

      - name: Extract SHA from profile (as rules_apple)
        run: |
          set -uo pipefail
          cd telegram-ios
          openssl smime -verify -noverify -inform der \
            -in build-system/fake-codesigning/profiles/Telegram.mobileprovision \
            -out /tmp/prof.plist
          python3 - <<'EOF'
          import base64, hashlib, plistlib
          with open('/tmp/prof.plist','rb') as fh:
              pl = plistlib.load(fh)
          cert = pl['DeveloperCertificates'][0]
          sha1 = hashlib.sha1(base64.b64decode(cert)).hexdigest().upper()
          print("SHA1 из профиля:", sha1)
          print("Entitlements:", pl.get('Entitlements'))
          EOF

      - name: codesign in Bazel-like action context
        run: |
          set -uo pipefail
          cd telegram-ios
          SHA="$(openssl smime -verify -noverify -inform der \
            -in build-system/fake-codesigning/profiles/Telegram.mobileprovision \
            -out /tmp/prof.plist 2>/dev/null; python3 -c "
          import base64,hashlib,plistlib
          pl=plistlib.load(open('/tmp/prof.plist','rb'))
          print(hashlib.sha1(base64.b64decode(pl['DeveloperCertificates'][0])).hexdigest().upper())")"
          echo "signing identity: $SHA"
          DUMMY=$(mktemp -d)
          printf 'int main(){return 0;}\n' > "$DUMMY/main.c"
          clang -o "$DUMMY/hello" "$DUMMY/main.c"
          echo "--- codesign как Bazel-экшен (env - + HOME) ---"
          env - HOME="$HOME" PATH=/bin:/usr/bin:/usr/local/bin \
            /usr/bin/codesign -v --sign "$SHA" --force "$DUMMY/hello" \
            && echo "CODESIGN OK (env -)" || echo "CODESIGN FAIL (env -)"
          echo "--- codesign без env - ---"
          /usr/bin/codesign -v --sign "$SHA" --force "$DUMMY/hello" \
            && echo "CODESIGN OK (normal)" || echo "CODESIGN FAIL (normal)"
          security find-identity -v -p codesigning
