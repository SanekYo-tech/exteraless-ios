name: Client UIKit Acceptance

# Expensive full app graph + serial fresh simulators. Coordinator dispatches only
# after the complete source cohort and the matching Xcode build are ready.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One harness source tree, across all refs on persistent or ephemeral runners.
  group: client-ui-harness
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: xcode-27
    timeout-minutes: 200
    concurrency:
      # Also share the current normal app workflow's same-ref admission key.
      # The build owner can widen both keys to one repository-wide app queue.
      group: ios-build-${{ github.ref }}
      cancel-in-progress: false
    env:
      # The normal app build owns /Users/Shared/telegram-ios. This separate tree
      # has its own sentinel, generation and lock; only its source child is synced.
      OWNED_ROOT: /Users/Shared/exteraless-client-ui-harness
      SOURCE_DIR: /Users/Shared/exteraless-client-ui-harness/telegram-ios
      BAZEL_USER_ROOT: /Users/Shared/exteraless-client-ui-harness/bazel-user-root
      WORKSPACE_GENERATION: ${{ github.run_id }}-${{ github.run_attempt }}
      # Reuse the app's content-addressed action/download caches, never delete them.
      BAZEL_DISK_CACHE: /Users/runner/Library/Caches/exteraless-bazel-disk
      PYTHON_SUPPORT_CACHE: /Users/runner/Library/Caches/exteraless-python-support
    steps:
      - name: Checkout complete app graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up CI analysis Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Create fresh run diagnostics
        run: |
          set -euo pipefail
          CLIENT_UI_RUN_DIR="$(mktemp -d "$RUNNER_TEMP/client-ui.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          echo "CLIENT_UI_RUN_DIR=$CLIENT_UI_RUN_DIR" >> "$GITHUB_ENV"

      - name: Select the version-pinned app toolchain
        run: |
          set -euo pipefail
          SELECTED_XCODE="$(python -B -c 'import sys; sys.path.insert(0, "tools/runtime"); from client_ui_harness_build import pinned_xcode_app; print(pinned_xcode_app("telegram-ios"))')"
          test -d "$SELECTED_XCODE/Contents/Developer"
          export DEVELOPER_DIR="$SELECTED_XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Fail early on missing production seams or incompatible SDK
        run: >-
          python tools/runtime/client_ui_harness_build.py --phase preflight
          --output "$CLIENT_UI_RUN_DIR/build"

      - name: Check bounded driver contracts
        run: python -B -m unittest discover -s telegram-ios/Tests/ExteralessHarness/Tests -v

      - name: Check native map, glob and evidence contracts
        run: >-
          python -B -m unittest tools.ci.tests.test_native_test_workflow
          tools.ci.tests.test_native_fixture_classes tools.ci.tests.test_client_ui_batches
          tools.ci.tests.test_native_input_identity -v

      - name: Stage or refresh the sentinel-owned harness source
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py stage
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --source "$GITHUB_WORKSPACE/telegram-ios"

      - name: Restore checked Python inputs
        id: python-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.PYTHON_SUPPORT_CACHE }}
          key: python-ios-support-${{ hashFiles('python/runtime/support-lock.json', 'python/runtime/dependency-lock.json', 'python/runtime/new-native-dependency-lock.json') }}

      - name: Prepare full runtime resources and frameworks
        timeout-minutes: 10
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py exec
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --seconds 600 -- python tools/runtime/prepare_telegram_runtime.py
          --source-root "$GITHUB_WORKSPACE" --telegram-root "$SOURCE_DIR"
          --cache "$PYTHON_SUPPORT_CACHE" --dependency-cache "$PYTHON_SUPPORT_CACHE/wheels"
          --report "$CLIENT_UI_RUN_DIR/build/runtime-staging.json"

      - name: Restore app-graph Bazel actions
        id: bazel-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-ios-unsigned-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('telegram-ios/versions.json', 'docs/submodule-pins.json', 'telegram-ios/MODULE.bazel.lock') }}-ui-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-ios-unsigned-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('telegram-ios/versions.json', 'docs/submodule-pins.json', 'telegram-ios/MODULE.bazel.lock') }}-

      - name: Build full Telegram plus loginless UIKit app, unsigned
        timeout-minutes: 112
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py exec
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --seconds 6720 -- python -u tools/runtime/client_ui_harness_build.py
          --telegram-root "$SOURCE_DIR" --output "$CLIENT_UI_RUN_DIR/build"
          --cache "$BAZEL_DISK_CACHE" --bazel-root "$BAZEL_USER_ROOT"

      - name: Compile and run required native IntegrationTests, unsigned iOS 27
        timeout-minutes: 36
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py exec
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --seconds 2100 -- python -u tools/runtime/run_native_integration_tests.py
          --telegram-root "$SOURCE_DIR" --owned-root "$OWNED_ROOT"
          --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --cache "$BAZEL_DISK_CACHE" --bazel-root "$BAZEL_USER_ROOT"
          --app-build-report "$CLIENT_UI_RUN_DIR/build/build-result.json"
          --output "$CLIENT_UI_RUN_DIR/native-tests" --compile-seconds 900 --execution-seconds 900

      - name: Install checksum-pinned CI frame tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -m venv "$CLIENT_UI_RUN_DIR/frame-env"
          "$CLIENT_UI_RUN_DIR/frame-env/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r telegram-ios/Tests/ExteralessHarness/Tools/frame-requirements.txt
          python tools/runtime/client_ui_harness_tools.py --output "$CLIENT_UI_RUN_DIR/tools" --cache "$CLIENT_UI_RUN_DIR/tools-cache"
          echo "$CLIENT_UI_RUN_DIR/tools" >> "$GITHUB_PATH"

      - name: Record baseline core-light, core-dark and SDK scenarios
        timeout-minutes: 10
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py exec
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --seconds 600 -- "$CLIENT_UI_RUN_DIR/frame-env/bin/python" -u tools/runtime/record_client_ui_batch.py
          --build-report "$CLIENT_UI_RUN_DIR/build/build-result.json"
          --native-tests "$CLIENT_UI_RUN_DIR/native-tests/result.json"
          --ipa "$CLIENT_UI_RUN_DIR/build/ClientUIHarness.ipa"
          --staging-manifest "$SOURCE_DIR/build-input/exteraless/runtime-staging.json"
          --telegram-root "$SOURCE_DIR" --output "$CLIENT_UI_RUN_DIR/evidence/baseline"
          --scenario core-light --scenario core-dark --scenario sdk-ui

      - name: Record Feed, Player and Pill domains serially from the same IPA
        timeout-minutes: 10
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py exec
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --seconds 600 -- "$CLIENT_UI_RUN_DIR/frame-env/bin/python" -u tools/runtime/record_client_ui_batch.py
          --build-report "$CLIENT_UI_RUN_DIR/build/build-result.json"
          --native-tests "$CLIENT_UI_RUN_DIR/native-tests/result.json"
          --ipa "$CLIENT_UI_RUN_DIR/build/ClientUIHarness.ipa"
          --staging-manifest "$SOURCE_DIR/build-input/exteraless/runtime-staging.json"
          --telegram-root "$SOURCE_DIR" --output "$CLIENT_UI_RUN_DIR/evidence/domains"
          --scenario feed-render --scenario player-render --scenario pill-render

      - name: Record Avatar and Composer from the same IPA in the final serial batch
        timeout-minutes: 10
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py exec
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --seconds 600 -- "$CLIENT_UI_RUN_DIR/frame-env/bin/python" -u tools/runtime/record_client_ui_batch.py
          --build-report "$CLIENT_UI_RUN_DIR/build/build-result.json"
          --native-tests "$CLIENT_UI_RUN_DIR/native-tests/result.json"
          --ipa "$CLIENT_UI_RUN_DIR/build/ClientUIHarness.ipa"
          --staging-manifest "$SOURCE_DIR/build-input/exteraless/runtime-staging.json"
          --telegram-root "$SOURCE_DIR" --output "$CLIENT_UI_RUN_DIR/evidence/final-visuals"
          --scenario avatar-render --scenario composer-render

      - name: Verify all three recorded batches and publish the shared evidence identity
        timeout-minutes: 1
        run: >-
          python -u tools/runtime/client_ui_harness_workspace.py exec
          --root "$OWNED_ROOT" --repository "$GITHUB_REPOSITORY" --generation "$WORKSPACE_GENERATION"
          --seconds 45 -- python -B tools/runtime/verify_client_ui_batches.py
          --build-report "$CLIENT_UI_RUN_DIR/build/build-result.json"
          --native-tests "$CLIENT_UI_RUN_DIR/native-tests/result.json"
          --baseline "$CLIENT_UI_RUN_DIR/evidence/baseline" --domains "$CLIENT_UI_RUN_DIR/evidence/domains"
          --final-visuals "$CLIENT_UI_RUN_DIR/evidence/final-visuals"
          --output "$CLIENT_UI_RUN_DIR/evidence/batches.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload recorded frames and semantic evidence
        if: ${{ always() && env.CLIENT_UI_RUN_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-ui-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CLIENT_UI_RUN_DIR }}/evidence/
            ${{ env.CLIENT_UI_RUN_DIR }}/native-tests/
            ${{ env.CLIENT_UI_RUN_DIR }}/tools/frame-tools.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/preflight.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/build-result.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/build.log
            ${{ env.CLIENT_UI_RUN_DIR }}/build/unsigned-preflight.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/runtime-preflight.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/runtime-staging.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/domain-source-fingerprints.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/native-bundle-resources.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/native-test-plan.json
            ${{ env.CLIENT_UI_RUN_DIR }}/build/harness-inputs.json
          if-no-files-found: error
          retention-days: 7

      - name: Save completed Bazel actions
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-hit != 'true' && steps.bazel-cache.outputs.cache-primary-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Evidence status
        if: always()
        run: |
          echo 'Evidence: evidence/baseline/ (3), evidence/domains/ (3), evidence/final-visuals/ (2). All batches use the same compiled IPA, run serially after NativeIntegrationTests on distinct fresh simulators, and retain the 30s process cap. Missing batches/fingerprints fail the gate. MP4/frame review per telegram-ios/AGENTS.md is still required; semantic success is not a visual pass.' >> "$GITHUB_STEP_SUMMARY"
