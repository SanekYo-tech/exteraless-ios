name: Private UIKit chat-table symbol diagnostic

on:
  push:
    branches: [ci/uikit-chat-table-symbols-209d1115]

permissions:
  contents: read

concurrency:
  group: client-ui-harness
  cancel-in-progress: false

jobs:
  symbols:
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PROBE_OUTPUT: ${{ runner.temp }}/chat-table-symbols-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/diagnostics/uikit_chat_table_link_probe.py
            /telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/Chats/ExteralessChatTableController.swift
            /telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/Retention/ExteralessAyuImportController.swift
      - name: Bounded two-class SDK and symbol differential (compile-only)
        run: python3 -B tools/diagnostics/uikit_chat_table_link_probe.py
      - name: Retain exact-source compiler and symbol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-table-symbols-${{ github.run_id }}
          path: ${{ env.PROBE_OUTPUT }}
          retention-days: 7
          if-no-files-found: error
