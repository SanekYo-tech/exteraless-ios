name: Sealed native Elyx Mode ABA (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  mode-aba:
    name: NativeElyxModeABATests (4 Linux cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SWIFT_ROOT: /home/runner/swift-6.4.2
      SWIFT_BINPATH: /home/runner/swift-6.4.2/usr/bin
      EVIDENCE: ${{ github.workspace }}/build/elyx-mode-aba
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "15"
      PIP_RETRIES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            docs/wave-2
            tools/ci
            tools/compat/tests
            swift/PluginHost
            swift/ExteralessCore
            telegram-ios/submodules/TelegramUI/Sources/Exteraless
            telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/PluginUI
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify sealed sources and exact spans before execution
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD | tee "$EVIDENCE/cohort-sha.txt"
          uname -a | tee "$EVIDENCE/platform.log"
          python -u -B tools/ci/elyx_mode_aba_ci.py verify before 2>&1 | tee "$EVIDENCE/verify-before.log"
      - name: Install bounded helper import dependency
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s python -m pip install pytest==8.3.5 2>&1 | tee "$EVIDENCE/driver-tools.log"
      - name: Install Swift build dependencies
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq 2>&1 | tee "$EVIDENCE/apt-update.log"
          sudo apt-get install -y -qq binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev \
            libz3-dev pkg-config tzdata unzip zip zlib1g-dev 2>&1 | tee "$EVIDENCE/apt-install.log"
      - name: Restore existing Swift 6.4.2 toolchain cache
        id: swift-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.SWIFT_ROOT }}
          key: swift-6.4.2-ubuntu24.04-x86_64
      - name: Install the existing Swift release on cache miss
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$SWIFT_ROOT"
          tarball="swift-6.4.2-RELEASE-ubuntu24.04.tar.gz"
          url="https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/${tarball}"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 300 -o "${SWIFT_ROOT}/${tarball}" "$url"
          sha256sum "${SWIFT_ROOT}/${tarball}" > "$EVIDENCE/swift-download.sha256"
          tar -xzf "${SWIFT_ROOT}/${tarball}" -C "$SWIFT_ROOT" --strip-components=1
          rm -f "${SWIFT_ROOT}/${tarball}"
          test -x "${SWIFT_BINPATH}/swift"
      - name: Verify and record pinned compiler identity
        run: |
          set -euo pipefail
          printf '%s  %s\n' 76db9f3dd8487a14ae39374509620e33af02f10da5dc42247406657832e4e9da "$SWIFT_BINPATH/swift-frontend" | sha256sum --check | tee "$EVIDENCE/toolchain-check.log"
          echo "$SWIFT_BINPATH" >> "$GITHUB_PATH"
          "$SWIFT_BINPATH/swift" --version | tee "$EVIDENCE/swift-version.log"
          sha256sum "$SWIFT_BINPATH/swift-frontend" > "$EVIDENCE/swift-frontend.sha256"
      - name: Execute sealed driver (120s compile, 30s native test)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          # stdbuf's inherited libc settings flush native XCTest lines on hangs.
          # The supplied driver, Swift sources, commands and deadlines are intact.
          stdbuf -oL -eL python -u -B tools/ci/elyx_mode_aba_ci.py run 2>&1 | tee "$EVIDENCE/driver.log"
      - name: Verify sealed sources and exact spans after execution
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python -u -B tools/ci/elyx_mode_aba_ci.py verify after 2>&1 | tee "$EVIDENCE/verify-after.log"
      - name: Record actual four-case XCTest results and JUnit
        if: always()
        run: python -u -B tools/ci/elyx_mode_aba_ci.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: elyx-mode-aba-posix-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
