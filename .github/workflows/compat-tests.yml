name: Elyx FD cancellation fixture validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  host-only:
    name: Frozen native Host 47 with cancellable fixture waits (POSIX)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SWIFT_ROOT: /home/runner/swift-6.4.2
      EVIDENCE: ${{ github.workspace }}/build/elyx-fd-cancellation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            docs/wave-2
            python
            tools/runtime
            tools/compat/tests
            swift/PluginHost
            swift/ExteralessCore
            telegram-ios/submodules/TelegramUI/Sources/ExteralessClient/PluginUI
            telegram-ios/submodules/TelegramUI/Tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify frozen input pins
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          cp docs/wave-2/elyx-posix-source-pins.json "$EVIDENCE/"
          git rev-parse HEAD | tee "$EVIDENCE/cohort-sha.txt"
          python -c 'import json; p=json.load(open("docs/wave-2/elyx-posix-source-pins.json")); print("\n".join("{}  {}".format(f["canonical_sha256"], f["path"]) for f in p["files"]))' > "$EVIDENCE/sources.sha256"
          sha256sum --check "$EVIDENCE/sources.sha256" > "$EVIDENCE/source-check.log"
          uname -a | tee "$EVIDENCE/platform.log"
      - name: Install existing Swift build dependencies
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq 2>&1 | tee "$EVIDENCE/apt-update.log"
          sudo apt-get install -y -qq binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev \
            libz3-dev pkg-config tzdata unzip zip zlib1g-dev 2>&1 | tee "$EVIDENCE/apt-install.log"
      - name: Restore existing Swift 6.4.2 toolchain
        id: swift-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.SWIFT_ROOT }}
          key: swift-6.4.2-ubuntu24.04-x86_64
      - name: Install the existing Swift release on cache miss
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$SWIFT_ROOT"
          tarball="swift-6.4.2-RELEASE-ubuntu24.04.tar.gz"
          url="https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/${tarball}"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 300 -o "${SWIFT_ROOT}/${tarball}" "$url"
          sha256sum "${SWIFT_ROOT}/${tarball}" > "$EVIDENCE/swift-download.sha256"
          tar -xzf "${SWIFT_ROOT}/${tarball}" -C "$SWIFT_ROOT" --strip-components=1
          rm -f "${SWIFT_ROOT}/${tarball}"
      - name: Verify compiler identity
        run: |
          set -euo pipefail
          printf '%s  %s\n' 76db9f3dd8487a14ae39374509620e33af02f10da5dc42247406657832e4e9da "$SWIFT_ROOT/usr/bin/swift-frontend" | sha256sum --check | tee "$EVIDENCE/toolchain-check.log"
          echo "${SWIFT_ROOT}/usr/bin" >> "$GITHUB_PATH"
          "${SWIFT_ROOT}/usr/bin/swift" --version | tee "$EVIDENCE/swift-version.log"
      - name: Compile complete Host and tests (180 seconds)
        working-directory: swift/PluginHost
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s swift build --build-tests --jobs 2 2>&1 | tee "$EVIDENCE/build.log"
          bin_path="$(timeout --signal=KILL 10s swift build --show-bin-path)"
          find "$bin_path" -maxdepth 1 -type f \( -name '*test-runner' -o -name '*.so' -o -name '*.xctest' \) -exec sha256sum {} + > "$EVIDENCE/compiled-images.sha256"
      - name: Run all 47 cases with unbuffered native output (30 seconds)
        working-directory: swift/PluginHost
        run: |
          set -euo pipefail
          timeout --signal=KILL 30s stdbuf -o0 -e0 swift test --skip-build --jobs 2 \
            --filter 'PluginElyxDeveloper(ActivationTests|FilesTests|Tests)' \
            --xunit-output "$EVIDENCE/native.xml" 2>&1 | tee "$EVIDENCE/test.log"
      - name: Require every sealed Host case and retain native-linked JUnit
        if: always()
        run: |
          python -B - <<'PY'
          import collections, hashlib, json, os, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["EVIDENCE"])
          root.mkdir(parents=True, exist_ok=True)
          pins = json.loads(pathlib.Path("docs/wave-2/elyx-posix-source-pins.json").read_text())
          expected = set(pins["native_fd_final"]["expected_tests"]["host"]["case_ids"])
          assert len(expected) == 47
          log = root / "test.log"
          if not log.exists():
              (root / "counts.json").write_text('{"error":"Native test log absent; inspect build log","expected":47}\n')
              raise SystemExit("No native Host execution log")
          raw = log.read_bytes()
          text = re.sub(r"\x1b\[[0-9;]*m", "", raw.decode("utf-8", "replace"))
          normalize = lambda n: ".".join(n.rsplit(".", 2)[-2:])
          starts = [normalize(n) for n in re.findall(r"^Test Case '([A-Za-z0-9_.]+\.test[A-Za-z0-9_]+)' started at .+$", text, re.M)]
          finished = [(normalize(n), s, t) for n, s, t in re.findall(r"^Test Case '([A-Za-z0-9_.]+\.test[A-Za-z0-9_]+)' (passed|failed|skipped) \(([0-9.]+) seconds\)$", text, re.M)]
          summary = re.search(r"^Test Suite 'Selected tests' (passed|failed) at [^\n]+\n\s*Executed (\d+) tests, with (\d+) failures \((\d+) unexpected\) in ([0-9.]+) \([0-9.]+\) seconds", text, re.M)
          cases = [{"class": n.split(".")[0], "name": n.split(".")[1], "status": s, "seconds": t} for n, s, t in finished]
          counts = {"expected": 47, "tests": len(cases), "passed": sum(c["status"] == "passed" for c in cases),
                    "failures": sum(c["status"] == "failed" for c in cases), "errors": 0,
                    "skipped": sum(c["status"] == "skipped" for c in cases), "seconds": summary[5] if summary else None,
                    "cases": cases, "module_counts": dict(collections.Counter(c["class"] for c in cases)),
                    "log_sha256": hashlib.sha256(raw).hexdigest(), "cohort_sha": os.environ["GITHUB_SHA"],
                    "provenance": "Actual native XCTest case events and complete Selected tests summary"}
          issues = []
          if collections.Counter(starts) != collections.Counter({n: 1 for n in expected}):
              issues.append("Native start inventory differs from sealed 47 cases")
          if collections.Counter(n for n, _, _ in finished) != collections.Counter({n: 1 for n in expected}):
              issues.append("Native finish inventory differs from sealed 47 cases")
          if summary is None or summary[1] != "passed" or int(summary[2]) != 47 or int(summary[3]) != 0:
              issues.append("Missing or nonpassing complete native suite summary")
          if counts["passed"] != 47 or counts["skipped"]:
              issues.append("Required cases failed, skipped or did not complete")
          counts["report_errors"] = issues
          counts["native_diagnostic_lines"] = [line for line in text.splitlines() if "error:" in line or re.search(r"\.swift:\d+", line)]
          document = ET.Element("testsuites")
          suite = ET.SubElement(document, "testsuite", name="Sealed native Host 47", tests=str(len(cases)),
                                failures=str(counts["failures"]), errors="0", skipped=str(counts["skipped"]), time=counts["seconds"] or "0")
          properties = ET.SubElement(suite, "properties")
          for name, value in (("source", "test.log native XCTest case events"), ("source_sha256", counts["log_sha256"]), ("cohort_sha", counts["cohort_sha"])):
              ET.SubElement(properties, "property", name=name, value=value)
          for case in cases:
              item = ET.SubElement(suite, "testcase", classname=case["class"], name=case["name"], time=case["seconds"])
              if case["status"] == "failed":
                  ET.SubElement(item, "failure", message="Native XCTest failure").text = "\n".join(counts["native_diagnostic_lines"])
              elif case["status"] == "skipped":
                  ET.SubElement(item, "skipped")
          if issues:
              ET.SubElement(suite, "system-err").text = "\n".join(issues)
          ET.ElementTree(document).write(root / "xctest.xml", encoding="utf-8", xml_declaration=True)
          (root / "counts.json").write_text(json.dumps(counts, indent=2) + "\n")
          print(json.dumps({k:v for k,v in counts.items() if k not in ("cases", "native_diagnostic_lines")}))
          assert not issues, issues
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: elyx-fd-cancellation-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
