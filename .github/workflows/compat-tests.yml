name: Elyx load preflight and platform POSIX

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  python-posix:
    name: Archive load preflight + platform selectors (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVIDENCE: ${{ github.workspace }}/build/elyx-load-preflight/python
      PYTHONPATH: ${{ github.workspace }}/python/vendor
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "15"
      PIP_RETRIES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            docs/wave-2
            python
            tools/runtime
            tools/compat/tests
            swift/PluginHost
            swift/ExteralessCore
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify immutable source pins
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          cp docs/wave-2/elyx-posix-source-pins.json "$EVIDENCE/"
          git rev-parse HEAD | tee "$EVIDENCE/cohort-sha.txt"
          python -c 'import json; p=json.load(open("docs/wave-2/elyx-posix-source-pins.json")); print("\n".join("{}  {}".format(f["canonical_sha256"], f["path"]) for f in p["files"]))' > "$EVIDENCE/sources.sha256"
          sha256sum --check "$EVIDENCE/sources.sha256" > "$EVIDENCE/source-check.log"
          python -c 'import os,sys; assert os.name == "posix" and sys.version_info[:2] == (3,12); assert os.open in os.supports_dir_fd; print(sys.version)' | tee "$EVIDENCE/python-version.log"
          uname -a | tee "$EVIDENCE/platform.log"
      - name: Install pinned fixture and C build tools
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s python -m pip install pytest==8.3.5 setuptools==77.0.3 2>&1 | tee "$EVIDENCE/tool-install.log"
          python -m pip freeze > "$EVIDENCE/test-tools.txt"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/python-wheel-cache
          key: python-pure-dependencies-${{ hashFiles('python/runtime/dependency-lock.json') }}
      - name: Stage checksum-locked pure dependencies
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s python -B tools/runtime/vendor_dependencies.py \
            --cache "$RUNNER_TEMP/python-wheel-cache" \
            --output "$GITHUB_WORKSPACE/python/vendor" \
            --report "$EVIDENCE/python-dependencies.json" 2>&1 | tee "$EVIDENCE/vendor.log"
          python -c 'import yaml; assert yaml.__version__ == "6.0.3" and not yaml.__with_libyaml__; print(yaml.__file__)' | tee "$EVIDENCE/yaml-provider.log"
      - name: Fresh build of inherited C bridge
        working-directory: python/bridge
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s python -B setup.py build_ext --inplace --force 2>&1 | tee "$EVIDENCE/c-build.log"
          sha256sum _exteraless_bridge*.so > "$EVIDENCE/c-extension.sha256"
      - name: Discover and run exactly five owned modules
        run: |
          set -euo pipefail
          modules=(
            tools/compat/tests/test_ios_elyx_archives.py
            tools/compat/tests/test_ios_elyx_p1.py
            tools/compat/tests/test_ios_elyx_source_authority.py
            tools/compat/tests/test_ios_runtime.py
            tools/compat/tests/test_ios_elyx_platform.py
          )
          timeout --signal=KILL 30s python -B -m pytest --rootdir "$GITHUB_WORKSPACE" --collect-only -q --no-header --color=no \
            "${modules[@]}" 2>&1 | tee "$EVIDENCE/collection.log"
          timeout --signal=KILL 120s python -B -m pytest --rootdir "$GITHUB_WORKSPACE" -q -s --color=no \
            "${modules[@]}" --basetemp "$RUNNER_TEMP/elyx-load-preflight-owned" \
            --junitxml "$EVIDENCE/archive.xml" 2>&1 | tee "$EVIDENCE/pytest.log"
      - name: Verify all discovered cases and zero POSIX skips
        if: always()
        run: |
          python -B - <<'PY'
          import collections, json, os, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["EVIDENCE"])
          root.mkdir(parents=True, exist_ok=True)
          report = root / "archive.xml"
          collection = root / "collection.log"
          if not report.exists() or not collection.exists():
              (root / "counts.json").write_text('{"error":"Missing pytest collection or JUnit; inspect build/test logs"}\n')
              raise SystemExit("Missing owned pytest evidence")
          discovered = re.findall(r"^(tools/compat/tests/[^:\r\n]+\.py::[^\r\n]+)$", collection.read_text(), re.M)
          document = ET.parse(report)
          cases = list(document.iter("testcase"))
          nodes = ["tools/compat/tests/" + c.get("classname", "").rsplit(".", 1)[-1] + ".py::" + c.get("name", "") for c in cases]
          counts = {"tests": len(cases), "discovered": len(discovered),
                    "failures": sum(c.find("failure") is not None for c in cases),
                    "errors": sum(c.find("error") is not None for c in cases),
                    "skipped": sum(c.find("skipped") is not None for c in cases)}
          counts["passed"] = counts["tests"] - counts["failures"] - counts["errors"] - counts["skipped"]
          counts["seconds"] = sum(float(s.get("time", "0")) for s in document.iter("testsuite"))
          counts["module_counts"] = dict(collections.Counter(n.split("::", 1)[0] for n in nodes))
          counts["cases"] = [{"nodeid": n, "seconds": c.get("time")} for n, c in zip(nodes, cases)]
          counts["failure_details"] = [{"nodeid": n, "kind": tag, "message": detail.get("message"), "text": detail.text}
                                       for n, c in zip(nodes, cases) for tag in ("failure", "error")
                                       if (detail := c.find(tag)) is not None]
          counts["handoff_approximation"] = 50
          counts["discovery_differs_from_approximation"] = len(discovered) != 50
          (root / "collected-nodeids.json").write_text(json.dumps(discovered, indent=2) + "\n")
          (root / "counts.json").write_text(json.dumps(counts, indent=2) + "\n")
          print(json.dumps({k:v for k,v in counts.items() if k not in ("cases", "failure_details")}))
          modules = {"test_ios_elyx_archives", "test_ios_elyx_p1", "test_ios_elyx_source_authority", "test_ios_runtime", "test_ios_elyx_platform"}
          assert {n.split("::", 1)[0] for n in discovered} == {"tools/compat/tests/" + m + ".py" for m in modules}
          assert collections.Counter(nodes) == collections.Counter(discovered), "Executed JUnit cases differ from actual discovery"
          assert len(discovered) == len(set(discovered)) and discovered, "Missing or duplicate discovered cases"
          required = {"test_elyx_p1[fd_extract_swap]", "test_elyx_p1[fd_cleanup_swap]", "test_elyx_p1[fd_replacements]",
                      "test_elyx_p1[raw_os_paths]", "test_elyx_p1[two_owners]", "test_source_authority[namespace_replace]",
                      "test_source_authority[verified_sdk]", "test_source_authority[load_policy_requires]",
                      "test_source_authority[load_policy_python]", "test_source_authority[load_policy_dependencies]",
                      "test_platform_family[posix_fd]", "test_ios_elyx_archive[symlink_cache]"}
          assert required <= {c.get("name") for c in cases}, "Required policy/POSIX witnesses missing"
          assert counts["passed"] == counts["tests"] and counts["skipped"] == 0, "Owned cohort has failures, errors or skips"
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: elyx-load-preflight-python-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
