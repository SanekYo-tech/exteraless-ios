name: Compat Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-proof:
    name: Bazel 9.2 AC completeness toy (Linux only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            tools/runtime
            tools/ci/tests
            telegram-ios/build-system/Make
      - name: Prepare pinned toy tools and source-only Apple wrapper fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-proof-tools"
          curl --fail --location --max-time 60 https://github.com/bazelbuild/bazel/releases/download/9.2.0/bazel-9.2.0-linux-x86_64 -o "$RUNNER_TEMP/cache-proof-tools/bazel"
          echo "7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694  $RUNNER_TEMP/cache-proof-tools/bazel" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/cache-proof-tools/bazel"
          git show b06bb00064157eb2df3d21a3cf0166e8e33cd259:tools/runtime/native_test_cache.py > "$RUNNER_TEMP/cache-proof-tools/before_cache.py"
          rules=telegram-ios/build-system/bazel-rules/rules_apple
          mkdir -p "$rules/apple/testing/default_runner" "$rules/apple/internal/testing"
          curl --fail --location --max-time 15 https://raw.githubusercontent.com/bazelbuild/rules_apple/485016eb5b0948cc17307064e7977a6d68e94046/apple/testing/default_runner/ios_test_runner.template.sh -o "$rules/apple/testing/default_runner/ios_test_runner.template.sh"
          curl --fail --location --max-time 15 https://raw.githubusercontent.com/bazelbuild/rules_apple/485016eb5b0948cc17307064e7977a6d68e94046/apple/internal/testing/apple_test_rule_support.bzl -o "$rules/apple/internal/testing/apple_test_rule_support.bzl"
      - name: Bounded protocol, POSIX closure and wrapper-input checks
        run: timeout 30 python -B -m unittest tools.runtime.tests.test_native_test_cache -v
      - name: Real producer-consumer cache proof
        run: >-
          timeout 210 python -B tools/runtime/tests/bazel_cache_completeness_probe.py
          --bazel "$RUNNER_TEMP/cache-proof-tools/bazel"
          --before-cache-module "$RUNNER_TEMP/cache-proof-tools/before_cache.py"
          --output "$RUNNER_TEMP/cache-proof-report"
      - name: Upload only bounded toy receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cache-completeness-proof
          path: ${{ runner.temp }}/cache-proof-report
          if-no-files-found: warn
          retention-days: 14
