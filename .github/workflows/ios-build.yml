name: iOS Build

# Сборки дорогие (macOS-минуты). Только по запросу: workflow_dispatch.
# Ночного schedule и гейта «собирать, если HEAD изменился» больше нет —
# ручной запуск всегда собирает.

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Telegram-iOS + embedded Python
    runs-on: xcode-27
    timeout-minutes: 360
    outputs:
      app_version: ${{ steps.package.outputs.app_version }}
      build_number: ${{ steps.package.outputs.build_number }}

    env:
      SOURCE_DIR: /Users/Shared/telegram-ios
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
      BAZEL_DISK_CACHE: /Users/runner/Library/Caches/exteraless-bazel-disk
      PYTHON_SUPPORT_CACHE: /Users/runner/Library/Caches/exteraless-python-support

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Test unsigned build plumbing
        run: python3 -m unittest discover -s tools/ci/tests -p 'test_unsigned*.py' -v

      - name: Test runtime packaging (no plugins or simulators)
        run: python3 -m unittest discover -s tools/runtime/tests -p test_telegram_packaging.py -v

      - name: Select Xcode
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/telegram-ios"
          XCODE_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')"
          XCODE_APP="$(ls -d /Applications/Xcode_${XCODE_VERSION}.app 2>/dev/null || true)"
          if [ -z "$XCODE_APP" ]; then
            echo "::error::Pinned Xcode $XCODE_VERSION is missing from this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure api credentials
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/telegram-ios/build-system"
          python3 - <<'EOF'
          import json, os
          path = "exteraless-configuration.json"
          with open(path) as fh:
              config = json.load(fh)
          app_id = os.environ.get("TELEGRAM_APP_ID", "").strip()
          app_hash = os.environ.get("TELEGRAM_APP_HASH", "").strip()
          if app_id and app_hash:
              config["api_id"] = app_id
              config["api_hash"] = app_hash
              print("api credentials: overridden from secrets")
          else:
              print("api credentials: repo defaults (official Telegram-iOS)")
          with open(path, "w") as fh:
              json.dump(config, fh, indent="\t")
              fh.write("\n")
          EOF

      - name: Prepare pinned client patches and prove clean-base replay
        run: |
          python3 -B -m unittest discover -s tools/runtime/tests -p test_client_source_patches.py -v
          python3 -B tools/runtime/apply_telegram_client_patches.py \
            --prove-clean-base --report "$RUNNER_TEMP/client-source-patches.json"

      - name: Create canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          # .git files inside submodules point back into the checkout. They are
          # invalid after relocation; the build copy needs source, not Git data.
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/telegram-ios/" "$SOURCE_DIR/"

      - name: Restore pinned Python support archive
        id: python-support-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PYTHON_SUPPORT_CACHE }}
          key: python-ios-support-${{ hashFiles('python/runtime/support-lock.json', 'python/runtime/dependency-lock.json', 'python/runtime/new-native-dependency-lock.json') }}

      - name: Prepare runtime Bazel inputs
        run: |
          set -euo pipefail
          # Includes root Swift/C sources outside the relocated Telegram tree.
          # The preparer verifies SHA-256 even on a cache hit, generates the
          # declaration manifest from repository sources, and stages both arm64
          # platforms. Bazel owns framework thinning and final IPA bundling.
          python3 "$GITHUB_WORKSPACE/tools/runtime/prepare_telegram_runtime.py" \
            --source-root "$GITHUB_WORKSPACE" \
            --telegram-root "$SOURCE_DIR" \
            --cache "$PYTHON_SUPPORT_CACHE" \
            --dependency-cache "$PYTHON_SUPPORT_CACHE/wheels" \
            --report "$SOURCE_DIR/build/diagnostics/runtime-staging.json"

      - name: Save verified Python support archive
        if: steps.python-support-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PYTHON_SUPPORT_CACHE }}
          key: python-ios-support-${{ hashFiles('python/runtime/support-lock.json', 'python/runtime/dependency-lock.json', 'python/runtime/new-native-dependency-lock.json') }}

      - name: Restore Bazel cache
        id: bazel-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-ios-unsigned-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('telegram-ios/versions.json', 'docs/submodule-pins.json', 'telegram-ios/MODULE.bazel.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-ios-unsigned-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('telegram-ios/versions.json', 'docs/submodule-pins.json', 'telegram-ios/MODULE.bazel.lock') }}-

      - name: Build
        id: package
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          export APP_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')"
          export BUILD_NUMBER="${{ github.run_number }}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_DISK_CACHE" \
            build \
            --configurationPath="build-system/exteraless-configuration.json" \
            --unsigned \
            --continueOnError \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts"

      - name: Verify unsigned IPA, runtime embedding and entitlement templates
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python3 "$GITHUB_WORKSPACE/tools/ci/verify_unsigned_ipa.py" \
            build/artifacts/Telegram.ipa \
            --configuration build-system/exteraless-configuration.json \
            --version "$APP_VERSION" --build-number "$BUILD_NUMBER" \
            --report build/artifacts/build-manifest.json
          python3 build-system/Make/RuntimePackaging.py \
            --ipa build/artifacts/Telegram.ipa \
            --staging-manifest build-input/exteraless/runtime-staging.json \
            --report build/artifacts/runtime-manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          import shutil
          target = Path('build/artifacts/signing-entitlements')
          target.mkdir(parents=True, exist_ok=True)
          files = list(Path('bazel-bin/Telegram').glob('*.entitlements'))
          if not files:
              raise SystemExit('No generated entitlement templates to hand off for signing')
          for path in files:
              shutil.copy2(path, target / path.name)
          shutil.copy2('bazel-bin/Telegram/Telegram_dossier.zip', 'build/artifacts/Telegram_dossier.zip')
          shutil.copy2('build-input/exteraless/runtime-staging.json', 'build/artifacts/runtime-staging.json')
          runtime = json.loads(Path('build/artifacts/runtime-manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Unsigned IPA + six extensions; CPython {}, {} runtime frameworks; resource/rpath verification passed.\n'.format(
                  runtime['actual_cpython'], len(runtime['frameworks'])))
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exteraless-ios-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.ipa
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.DSYMs.zip
            ${{ env.SOURCE_DIR }}/build/artifacts/build-manifest.json
            ${{ env.SOURCE_DIR }}/build/artifacts/runtime-manifest.json
            ${{ env.SOURCE_DIR }}/build/artifacts/runtime-staging.json
            ${{ runner.temp }}/client-source-patches.json
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram_dossier.zip
            ${{ env.SOURCE_DIR }}/build/artifacts/signing-entitlements/
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned/runtime preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-preflight-${{ github.run_id }}
          # Full aquery dumps may contain generated configuration values.
          # Publish only the structural report, not file-write contents.
          path: |
            ${{ env.SOURCE_DIR }}/build/diagnostics/unsigned-preflight.json
            ${{ env.SOURCE_DIR }}/build/diagnostics/runtime-preflight.json
            ${{ env.SOURCE_DIR }}/build/diagnostics/runtime-staging.json
            ${{ runner.temp }}/client-source-patches.json
          if-no-files-found: ignore
          retention-days: 7

      # Cache successful individual actions even when a later action fails.
      # The old combined cache action only saved on an entirely green build.
      - name: Save Bazel action cache
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  publish:
    name: Publish unsigned release
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified IPA artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exteraless-ios-${{ needs.build.outputs.app_version }}-${{ needs.build.outputs.build_number }}
          path: release-assets

      - name: Check artifact identity before creating the release
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          root = Path('release-assets')
          ipa = root / 'Telegram.ipa'
          manifest = json.loads((root / 'build-manifest.json').read_text())
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          expected = {
              'version': os.environ['APP_VERSION'],
              'build_number': os.environ['BUILD_NUMBER'],
              'sha256': digest,
          }
          for key, value in expected.items():
              if str(manifest.get(key)) != value:
                  raise SystemExit(f'Release artifact {key} mismatch: {manifest.get(key)!r} != {value!r}')
          if not str(manifest.get('signing', '')).startswith('unsigned'):
              raise SystemExit('Refusing to publish an artifact that is not unsigned')
          with zipfile.ZipFile(ipa) as archive:
              if archive.testzip() is not None or any(name.endswith('.mobileprovision') for name in archive.namelist()):
                  raise SystemExit('IPA failed ZIP/profile check before release')
          for name in ('Telegram.DSYMs.zip', 'runtime-manifest.json', 'Telegram_dossier.zip'):
              if not (root / name).is_file():
                  raise SystemExit('Missing release asset: ' + name)
          if not any((root / 'signing-entitlements').glob('*.entitlements')):
              raise SystemExit('Missing entitlement templates')
          print('Release identity verified', manifest['version'], manifest['build_number'], digest)
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          set -euo pipefail
          tag="exteraless-ios-${APP_VERSION}-${BUILD_NUMBER}"
          ipa="exteraless-ios-${APP_VERSION}-${BUILD_NUMBER}.ipa"
          mv release-assets/Telegram.ipa "release-assets/${ipa}"
          python3 - <<'PY'
          from pathlib import Path
          import os, textwrap, zipfile
          version, build = os.environ['APP_VERSION'], os.environ['BUILD_NUMBER']
          notes = textwrap.dedent(f'''\
          Unsigned IPA exteraless iOS {version} ({build}).

          Подписывается своим сертификатом. Bundle ID не менять: `ph.telegra.Telegraph`.
          В профиле и entitlements нужен App Group `group.ph.telegra.Telegraph`.
          Шаблоны прав лежат в `signing-entitlements.zip`.

          Относительно build 41: отказ App Group, ошибка записи контейнера и ошибка Client API
          показываются после подключения окна к сцене, а не остаются пустым экраном.
          Подтверждённый API-alert не повторяется после успешной перезагрузки settings.

          Это не доказательство причины чёрного экрана на конкретном устройстве и не приёмка
          434 native tests, 20 сцен и кадрового ревью. До публикации тот же workflow проверил
          unsigned Mach-O, resources, entitlement templates и SHA-256 артефакта.

          Commit: {os.environ['GITHUB_SHA']}
          ''')
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes)
          with zipfile.ZipFile('release-assets/signing-entitlements.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('release-assets/signing-entitlements').glob('*.entitlements')):
                  archive.write(path, path.name)
          PY
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "exteraless iOS ${APP_VERSION} (${BUILD_NUMBER})" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "release-assets/${ipa}" \
            release-assets/Telegram.DSYMs.zip \
            release-assets/signing-entitlements.zip \
            release-assets/build-manifest.json \
            release-assets/runtime-manifest.json \
            release-assets/Telegram_dossier.zip
