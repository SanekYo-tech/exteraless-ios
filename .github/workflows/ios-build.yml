name: iOS Build

# Сборки дорогие (macOS-минуты). Только по запросу: workflow_dispatch.
# Ночного schedule и гейта «собирать, если HEAD изменился» больше нет —
# ручной запуск всегда собирает.

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Telegram-iOS (exteraless base)
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      SOURCE_DIR: /Users/Shared/telegram-ios
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
      BAZEL_DISK_CACHE: /Users/runner/Library/Caches/exteraless-bazel-disk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Test unsigned build plumbing
        run: python3 -m unittest discover -s tools/ci/tests -v

      - name: Select Xcode
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/telegram-ios"
          XCODE_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')"
          XCODE_APP="$(ls -d /Applications/Xcode_${XCODE_VERSION}.app 2>/dev/null || true)"
          if [ -z "$XCODE_APP" ]; then
            echo "::error::Pinned Xcode $XCODE_VERSION is missing from this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure api credentials
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/telegram-ios/build-system"
          python3 - <<'EOF'
          import json, os
          path = "exteraless-configuration.json"
          with open(path) as fh:
              config = json.load(fh)
          app_id = os.environ.get("TELEGRAM_APP_ID", "").strip()
          app_hash = os.environ.get("TELEGRAM_APP_HASH", "").strip()
          if app_id and app_hash:
              config["api_id"] = app_id
              config["api_hash"] = app_hash
              print("api credentials: overridden from secrets")
          else:
              print("api credentials: repo defaults (official Telegram-iOS)")
          with open(path, "w") as fh:
              json.dump(config, fh, indent="\t")
              fh.write("\n")
          EOF

      - name: Create canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          # .git files inside submodules point back into the checkout. They are
          # invalid after relocation; the build copy needs source, not Git data.
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/telegram-ios/" "$SOURCE_DIR/"

      - name: Restore Bazel cache
        id: bazel-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-ios-unsigned-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('telegram-ios/versions.json', 'docs/submodule-pins.json', 'telegram-ios/MODULE.bazel.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-ios-unsigned-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('telegram-ios/versions.json', 'docs/submodule-pins.json', 'telegram-ios/MODULE.bazel.lock') }}-

      - name: Build
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          export APP_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')"
          export BUILD_NUMBER="${{ github.run_number }}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_DISK_CACHE" \
            build \
            --configurationPath="build-system/exteraless-configuration.json" \
            --unsigned \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts"

      - name: Verify unsigned IPA and collect entitlement templates
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python3 "$GITHUB_WORKSPACE/tools/ci/verify_unsigned_ipa.py" \
            build/artifacts/Telegram.ipa \
            --configuration build-system/exteraless-configuration.json \
            --version "$APP_VERSION" --build-number "$BUILD_NUMBER" \
            --report build/artifacts/build-manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('build/artifacts/signing-entitlements')
          target.mkdir(parents=True, exist_ok=True)
          files = list(Path('bazel-bin/Telegram').glob('*.entitlements'))
          if not files:
              raise SystemExit('No generated entitlement templates to hand off for signing')
          for path in files:
              shutil.copy2(path, target / path.name)
          shutil.copy2('bazel-bin/Telegram/Telegram_dossier.zip', 'build/artifacts/Telegram_dossier.zip')
          PY
          echo "Unsigned IPA + six extensions. Sign locally with your compatible profiles." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: exteraless-ios-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.ipa
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.DSYMs.zip
            ${{ env.SOURCE_DIR }}/build/artifacts/build-manifest.json
            ${{ env.SOURCE_DIR }}/build/artifacts/Telegram_dossier.zip
            ${{ env.SOURCE_DIR }}/build/artifacts/signing-entitlements/
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-preflight-${{ github.run_id }}
          # Full aquery dumps may contain generated configuration values.
          # Publish only the structural report, not file-write contents.
          path: ${{ env.SOURCE_DIR }}/build/diagnostics/unsigned-preflight.json
          if-no-files-found: ignore
          retention-days: 7

      # Cache successful individual actions even when a later action fails.
      # The old combined cache action only saved on an entirely green build.
      - name: Save Bazel action cache
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
